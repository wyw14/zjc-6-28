<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻牌配对小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🃏 翻牌配对小游戏</h1>
    
    <div class="level-progress">
      <div class="level-dot" id="levelDot1">1</div>
      <div class="level-line"></div>
      <div class="level-dot" id="levelDot2">2</div>
      <div class="level-line"></div>
      <div class="level-dot" id="levelDot3">3</div>
    </div>
    
    <div class="game-info">
      <div class="info-item">
        <span class="label">🏁 当前关卡</span>
        <span id="currentLevel" class="value">第一关</span>
      </div>
      <div class="info-item">
        <span class="label">⏱️ 剩余时间</span>
        <span id="timer" class="value">00:00</span>
      </div>
      <div class="info-item">
        <span class="label">👆 步数</span>
        <span id="moves" class="value">0</span>
      </div>
      <div class="info-item">
        <span class="label">✅ 已配对</span>
        <span id="matched" class="value">0/6</span>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="controls">
      <button id="restartBtn" class="btn btn-primary">🔄 重新开始</button>
      <button id="leaderboardBtn" class="btn btn-secondary">🏆 排行榜</button>
    </div>

    <div id="failModal" class="modal hidden">
      <div class="modal-content">
        <h2>⏰ 时间到！挑战失败</h2>
        <p id="failLevel">你在第一关挑战失败</p>
        <button id="showResultBtn" class="btn btn-primary">查看结算</button>
      </div>
    </div>

    <div id="resultModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="resultTitle">🏆 挑战结算</h2>
        <p>总用时：<span id="totalTime">00:00</span></p>
        <p>通关关数：<span id="passedLevels">0</span>/3</p>
        <div id="levelResults" class="level-results"></div>
        <div class="input-group">
          <label for="playerName">输入你的名字：</label>
          <input type="text" id="playerName" placeholder="匿名玩家" maxlength="10">
        </div>
        <button id="submitScoreBtn" class="btn btn-primary">提交成绩</button>
        <button id="playAgainBtn" class="btn btn-secondary">重新挑战</button>
      </div>
    </div>

    <div id="leaderboardModal" class="modal hidden">
      <div class="modal-content">
        <h2>🏆 排行榜</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
        <button id="closeLeaderboardBtn" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
